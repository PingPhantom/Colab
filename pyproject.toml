[project]
name = "strata-studio"
version = "0.3.0"
description = "llama.cpp model manager + StrataRAG + Colab UI สำหรับรันโมเดล GGUF บน GPU ฟรี"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26,<3",
  "requests>=2.31,<3",
  "rich>=13.7,<16",
  # openai ถูก import ตอนเรียกใช้จริง (>=1.55 คือ API ที่โค้ดนี้ใช้)
  "openai>=1.55,<4",
  # fastembed/pypdf ถูก import ตอนใช้ RAG (ติดตั้งไว้ล่วงหน้าเพราะ Colab ไม่มี)
  "fastembed>=0.4,<1",
  "pypdf>=4.2,<8",
  "ipywidgets>=8.1,<9",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
]

# ใช้ strata/ จาก repo ตรง ๆ ไม่ต้อง build/ติดตั้งตัวแพ็กเกจเข้า venv
[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "nix.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
  "E501",  # บรรทัดยาวมีเยอะใน HTML ของ UI
  "E702",  # โค้ดส่วนที่ port มาจาก notebook เขียนหลายคำสั่งในบรรทัดเดียว (คงรูปเดิมไว้ให้ diff ตรวจง่าย)
]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["S101"]
